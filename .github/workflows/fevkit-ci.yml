name: FEVKit CI

on:
  push:
    paths:
      - "products/fevkit/**"
      - ".github/workflows/fevkit-ci.yml"
  pull_request:
    paths:
      - "products/fevkit/**"
      - ".github/workflows/fevkit-ci.yml"

permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: products/fevkit
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: python -m fevkit audit examples/complete --profile differential-expression
      - run: python -m fevkit replay examples/complete --execute
      - run: |
          python -m fevkit audit examples/incomplete --format sarif --output fevkit.sarif || test $? -eq 2
      - run: python -m fevkit export-rocrate examples/complete --output /tmp/fevkit-crate
      - uses: github/codeql-action/upload-sarif@v3
        if: matrix.python-version == '3.12'
        with:
          sarif_file: products/fevkit/fevkit.sarif
